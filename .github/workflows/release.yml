name: release

# A release ships two things: the client binaries for each platform (each with
# adb embedded, so no separate adb install on the target machine) and the
# companion APK that goes on the TV.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: npm ci --no-audit --no-fund

      # Cross-builds every target; each one stages the adb build for the
      # platform it is compiled for, not for the runner.
      - name: Build the client binaries
        run: npm run build:all

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the companion APK
        run: ./companion/build.sh

      - name: What was produced
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: zapette-binaries
          path: |
            dist/tv-remote-tui*
            dist/tv-companion.apk
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tv-remote-tui*
            dist/tv-companion.apk
          generate_release_notes: true
          body: |
            Client binaries for each platform (adb embedded) and the companion
            APK for the TV. Install the APK on the TV with:

                adb install -r tv-companion.apk

            The client installs and pairs it for you on first connect if you
            answer yes at the prompt.
