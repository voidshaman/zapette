name: release

# A release ships two things: the client binaries for each platform (each with
# adb embedded, so no separate adb install on the target machine) and the
# companion APK that goes on the TV.
#
# It publishes without being asked:
#   - pushing a `v*` tag  -> a versioned release for that tag
#   - pushing to main     -> updates the rolling `latest` pre-release, so there
#                            are always current binaries to download
# A documentation-only push is ignored, because republishing 250 MB of binaries
# for a typo fix would be silly. Tags are unaffected by that filter.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: npm ci --no-audit --no-fund

      # A release with a broken suite is worse than no release, so the gate is
      # here rather than left to the separate test workflow.
      - name: Test
        run: npm test

      # Cross-builds every target; each one stages the adb build for the
      # platform it is compiled for, not for the runner.
      - name: Build the client binaries
        run: npm run build:all

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the companion APK
        run: ./companion/build.sh

      # scripts/build.mjs logs a failed target and carries on, so a green job can
      # still be missing a platform (that is how the linux-x64 binary once went
      # missing). This turns that into a failed release instead of a broken
      # download for whoever wanted that platform. Note the first name: the
      # runner's own target builds to the bare `zapette`, so on ubuntu that file
      # IS the Linux x64 binary and there is no zapette-linux-x64.
      - name: Every platform must be present
        run: |
          set -e
          missing=0
          for f in \
            dist/zapette \
            dist/zapette-darwin-x64 \
            dist/zapette-darwin-arm64 \
            dist/zapette-linux-arm64 \
            dist/zapette-win32-x64.exe \
            dist/zapette-win32-arm64.exe \
            dist/zapette-companion.apk
          do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; else ls -l "$f"; fi
          done
          if [ "$missing" != 0 ]; then
            echo "::error::a target failed to build - find the '[build] ... failed' line above"
            exit 1
          fi
          echo "all platforms present"

      - name: What was produced
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: zapette-binaries
          # Not `dist/zapette*`: that would also sweep up the APK's .idsig
          # sidecar. These are the stems scripts/build.mjs writes.
          path: |
            dist/zapette
            dist/zapette-slim
            dist/zapette-darwin-*
            dist/zapette-linux-*
            dist/zapette-win32-*
            dist/zapette-companion.apk
          if-no-files-found: error

      - name: Publish (tag -> versioned release, main -> rolling latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          generate_release_notes: false
          body: |
            Client binaries (adb included) and the companion APK. Install it with
            `adb install -r zapette-companion.apk`, or let the client do it on first connect.
          files: |
            dist/zapette
            dist/zapette-slim
            dist/zapette-darwin-*
            dist/zapette-linux-*
            dist/zapette-win32-*
            dist/zapette-companion.apk
